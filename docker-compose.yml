# Levanta todo el backend con un comando:  docker compose up --build
#   - db:      SQL Server 2022
#   - db-init: ejecuta los scripts de database/scripts en orden (esquema, SPs y datos) y termina
#   - api:     microservicio .NET en http://localhost:5080 (Swagger en /swagger)
name: task-manager

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-TaskManager!Dev2026}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-TaskManager!Dev2026}
    volumes:
      - ./database/scripts:/scripts:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        # 00_run_all.sql es para uso manual (modo SQLCMD); aquí se ejecutan 01..04.
        for f in /scripts/0[1-9]_*.sql; do
          echo "Ejecutando $$f"
          /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -i "$$f"
        done
    restart: "no"

  api:
    build:
      context: ./backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ConnectionString: "Server=db,1433;Database=TaskManagerDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-TaskManager!Dev2026};TrustServerCertificate=True;Encrypt=True;Application Name=TaskManager.Api"
    ports:
      - "5080:8080"

volumes:
  mssql-data:
